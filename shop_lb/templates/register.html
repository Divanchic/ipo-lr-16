{% extends 'base.html' %}

{% block title %}Хенд-мейд | Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-sm-9 col-12">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="mb-4 text-center">Регистрация нового пользователя</h2>
            <form id="register-form">
                <div class="row g-3">
                    <div class="col-md-6 col-12">
                        <label class="form-label">Логин *</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="col-md-6 col-12">
                        <label class="form-label">Пароль *</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Полное имя (ФИО)</label>
                        <input type="text" id="full_name" class="form-control" placeholder="Иванов Иван Иванович">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mt-4">Зарегистрироваться</button>
            </form>
            <div id="error-message" class="text-danger small text-center mt-3" style="display: none;"></div>
            <p class="text-center mt-3 mb-0 small">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const errorDiv = document.getElementById('error-message');

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            full_name: document.getElementById('full_name').value
        };

        fetch('/api/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/catalog/';
            } else {
                errorDiv.textContent = data.error || 'Ошибка регистрации';
                errorDiv.style.display = 'block';
            }
        })
        .catch(() => {
            errorDiv.textContent = 'Ошибка сервера';
            errorDiv.style.display = 'block';
        });
    });
</script>
{% endblock %}
