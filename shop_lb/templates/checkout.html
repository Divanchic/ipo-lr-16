{% extends 'base.html' %}

{% block title %}Хенд-мейд | Оформление заказа{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="mb-4 text-center">Оформление заказа</h2>
            
            <form action="{% url 'send_excel' %}" method="POST" id="order-form">
                {% csrf_token %}

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="check1">
                    <label class="form-check-label fw-bold" for="check1">
                        Я согласен на покупку
                    </label>
                </div>

                <div id="address-container" class="mb-3" style="display:none;">
                    <label class="form-label">Адрес доставки</label>
                    <input type="text" id="address" name="address" class="form-control" placeholder="Укажите город, улицу, дом, квартиру">
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="check2" name="need_receipt">
                    <label class="form-check-label" for="check2">
                        Прислать чек на почту
                    </label>
                </div>

                <div id="email-container" class="mb-4" style="display:none;">
                    <label class="form-label">Email для чека</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.com">
                </div>

                <button id="btn" type="submit" class="btn btn-primary w-100 py-2 fs-5" disabled>Оформить заказ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const c1 = document.getElementById('check1'),
          c2 = document.getElementById('check2'),
          ad = document.getElementById('address'),
          em = document.getElementById('email'),
          bt = document.getElementById('btn'),
          adCont = document.getElementById('address-container'),
          emCont = document.getElementById('email-container');

    const toggle = () => {
        adCont.style.display = c1.checked ? 'block' : 'none';
        emCont.style.display = c2.checked ? 'block' : 'none';

        const addrOk = c1.checked && ad.value.trim() !== "";
        const mailOk = !c2.checked || (c2.checked && em.value.trim() !== "");

        bt.disabled = !(addrOk && mailOk);
    };

    c1.onchange = c2.onchange = ad.oninput = em.oninput = toggle;
</script>
{% endblock %}
