{% extends 'base.html' %}

{% block title %}Хенд-мейд | Настройки{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-12">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="mb-4">Настройки аккаунта</h2>
            
            <form id="settings-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Новый Email</label>
                    <input type="email" id="new-email" class="form-control" value="{{ user.email }}">
                </div>
                <hr class="my-4">
                <div class="mb-3">
                    <label class="form-label">Новый пароль</label>
                    <input type="password" id="new-password" class="form-control" placeholder="Оставьте пустым, если не хотите менять">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Сохранить настройки</button>
            </form>
            
            <div id="settings-message" class="text-center small mt-3" style="display: none;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('settings-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const emailVal = document.getElementById('new-email').value;
        const passwordVal = document.getElementById('new-password').value;
        const msgDiv = document.getElementById('settings-message');

        fetch('/api/account/settings/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')
            },
            body: JSON.stringify({ email: emailVal, password: passwordVal })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                msgDiv.className = 'text-success small text-center mt-3';
                msgDiv.textContent = data.success;
                document.getElementById('new-password').value = '';
            } else {
                msgDiv.className = 'text-danger small text-center mt-3';
                msgDiv.textContent = data.error || 'Ошибка сохранения';
            }
            msgDiv.style.display = 'block';
        });
    });
</script>
{% endblock %}
