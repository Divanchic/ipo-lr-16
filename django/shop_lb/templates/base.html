{% load static %} 
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Хенд-мейд</title>

    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="{% url 'home' %}">Главная</a>
          <a class="nav-link" href="{% url 'product_list' %}">Каталог</a>
          <a class="nav-link" href="{% url 'cart_view' %}">Корзина</a>
        </div>
        <div class="navbar-nav">
          {% if user.is_authenticated %}
            <span class="nav-item nav-link text-white">Привет, {{ user.username }}!</span>
            <a class="btn btn-outline-light ms-2" href="{% url 'logout' %}">Выйти</a>
          {% else %}
            <a class="btn btn-outline-light ms-2" href="{% url 'login' %}">Войти</a>
          {% endif %}
        </div>
      </div>
    </nav>

   <div class="container mt-4">
        {% block content %}
    
        {% endblock %}
    </div>

    
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Магазин хенд-мейд украшений</p>
    </footer>

    <script src="https://jsdelivr.net"></script>
    
    
    {% block scripts %}
    {% endblock %}

</body>
</html>
